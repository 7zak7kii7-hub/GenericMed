apiVersion: v1
kind: Service
metadata:
  name: genericmed-core-service
  namespace: healthcare-production
  labels:
    app: genericmed-core
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
    - port: 443
      targetPort: 5000
      protocol: TCP
      name: https
  selector:
    app: genericmed-core
