version: '3.8'

services:
  genericmed-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genericmed/platform:0.8.0
    container_name: genericmed_production
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo-key}
      - ABDM_SANDBOX_GATEWAY=https://dev.abdm.gov.in/gateway
      - CDSCO_SUGAM_ENDPOINT=https://sugam.gov.in/cdsco/api
    volumes:
      - db-data:/app/backend/prisma
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - healthcare-net

volumes:
  db-data:
    driver: local

networks:
  healthcare-net:
    driver: bridge
